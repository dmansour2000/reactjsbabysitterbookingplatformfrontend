name: Deploy React App to Profile Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React/Vite app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || 'https://nodejsbabysitterbookingplatformbackend.onrender.com' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID || '146671912539-sctdecp31oeebjq3868adrj9eqbsjl33.apps.googleusercontent.com' }}
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT || secrets.VITE_ADSENSE_CLIENT || 'ca-pub-3496568058228119' }}
          VITE_ADSENSE_SLOT: ${{ vars.VITE_ADSENSE_SLOT || secrets.VITE_ADSENSE_SLOT || '8692700542' }}
        run: npm run build

      - name: Deploy to profile repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: dmansour2000/dmansour2000.github.io
          publish_branch: gh-pages
          publish_dir: ./dist


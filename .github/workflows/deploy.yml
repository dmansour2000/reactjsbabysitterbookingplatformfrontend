name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || 'https://nodejsbabysitterbookingplatformbackend.onrender.com' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID || '146671912539-sctdecp31oeebjq3868adrj9eqbsjl33.apps.googleusercontent.com' }}
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT || secrets.VITE_ADSENSE_CLIENT || 'ca-pub-3496568058228119' }}
          VITE_ADSENSE_SLOT: ${{ vars.VITE_ADSENSE_SLOT || secrets.VITE_ADSENSE_SLOT || '8692700542' }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Include the attempt number so rerunning a failed job cannot leave
          # two artifacts with the same name for deploy-pages to choose from.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
